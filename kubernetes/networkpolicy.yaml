apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: minecraft-netpol
spec:
  podSelector:
    matchLabels:
      app: minecraft
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 25565
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 443
          protocol: TCP
        - port: 80
          protocol: TCP
